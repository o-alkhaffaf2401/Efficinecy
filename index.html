<style>
:root{
  --bg:#fafafa; --panel:#fff; --border:#e6e6e6; --text:#18181b; --muted:#71717a;
  --accent:#4f46e5; --accent-light:#eef0fe; --radius:10px; --good:#16a34a; --warn:#d97706;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111113; --panel:#19191c; --border:#2a2a2e; --text:#f4f4f5; --muted:#9a9aa2; --accent:#818cf8; --accent-light:#242449; }
}
:root[data-theme="dark"]{ --bg:#111113; --panel:#19191c; --border:#2a2a2e; --text:#f4f4f5; --muted:#9a9aa2; --accent:#818cf8; --accent-light:#242449; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100%;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3{margin:0;font-weight:600;}
.app{display:flex;height:100%;min-height:100vh;}
/* Sidebar */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:2px;}
.sidebar .brand{font-weight:700;font-size:15px;padding:6px 10px 18px;}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;border:none;background:none;text-align:left;width:100%;}
.navitem:hover{background:var(--accent-light);color:var(--text);}
.navitem.active{background:var(--accent-light);color:var(--accent);}
.navitem svg{width:16px;height:16px;flex-shrink:0;}
.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:920px;}
.pagehead{margin-bottom:22px;}
.pagehead p{color:var(--muted);font-size:13.5px;margin:4px 0 0;}
/* Mobile nav */
.mobilenav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;}
.mobilenav .row{display:flex;justify-content:space-around;}
.mobilenav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font-size:10px;padding:4px 2px;}
.mobilenav button.active{color:var(--accent);}
.mobilenav svg{width:19px;height:19px;}
@media (max-width:820px){
  .sidebar{display:none;}
  .main{padding:20px 16px 90px;max-width:100%;}
  .mobilenav{display:block;}
}
/* Cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.card h3{font-size:14px;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.grid2{grid-template-columns:1fr;}}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
textarea{resize:vertical;min-height:90px;}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
.field{margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{opacity:0.92;}
.btn-ghost{border:none;background:none;color:var(--muted);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.row{display:flex;align-items:center;gap:8px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-light);color:var(--accent);}
.session{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:9px;background:var(--panel);}
.session .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.session .subj{font-weight:600;font-size:14px;}
.session .topic{color:var(--muted);font-size:13px;margin-top:1px;}
.session .meta{font-size:11.5px;color:var(--muted);margin-top:6px;}
.session.done{opacity:0.5;}
.session.done .subj{text-decoration:line-through;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
.progressbar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:6px;}
.progressbar .fill{height:100%;background:var(--accent);}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--panel);border-radius:14px;padding:26px;max-width:480px;width:100%;max-height:85vh;overflow:auto;}
.modal h2{margin-bottom:4px;}
.modal .step-dots{display:flex;gap:5px;margin:14px 0 18px;}
.step-dots span{width:22px;height:3px;border-radius:2px;background:var(--border);}
.step-dots span.on{background:var(--accent);}
.spec-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13.5px;gap:6px 10px;}
.spec-item span:first-child{flex:1 1 180px;min-width:140px;word-break:normal;overflow-wrap:break-word;}
.spec-item:last-child{border-bottom:none;}
.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;cursor:pointer;border-bottom:1px solid var(--border);}
.collapse-head:hover{color:var(--accent);}
.collapse-head .chev{transition:transform 0.15s;flex-shrink:0;}
.collapse-head.open .chev{transform:rotate(90deg);}
.collapse-body{padding-left:2px;}
.group-head{display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;font-weight:500;font-size:13px;border-bottom:1px solid var(--border);}
.group-head .chev{transition:transform 0.15s;flex-shrink:0;width:12px;height:12px;}
.group-head.open .chev{transform:rotate(90deg);}
.checklabel{display:flex;align-items:flex-start;gap:8px;padding:6px 4px 6px 20px;font-size:13px;}
.checklabel input{width:auto;flex-shrink:0;margin-top:2px;}
.checklabel span{flex:1;min-width:0;word-break:break-word;}
.status-pill{border:none;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;flex:0 0 auto;width:auto;max-width:130px;}
.close-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.subjectlist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chip{border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;}
.why-box{background:var(--accent-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text);margin-top:8px;}
.viewtabs{display:flex;gap:6px;margin-bottom:16px;}
.viewtabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:13px;font-weight:500;}
.viewtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
@media (max-width:820px){.weekgrid{grid-template-columns:1fr;}}
.daycol{border:1px solid var(--border);border-radius:9px;padding:8px;min-height:80px;background:var(--panel);}
.daycol.today{border-color:var(--accent);}
.daycol .dhead{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.dragcard{border:1px solid var(--border);border-radius:7px;padding:7px 8px;margin-bottom:6px;font-size:11.5px;background:var(--bg);cursor:grab;}
.dragcard.done{opacity:0.5;text-decoration:line-through;}
.dragcard b{display:block;font-size:12px;}
.daycol.dragover{background:var(--accent-light);}
.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.monthcell{border:1px solid var(--border);border-radius:8px;min-height:64px;padding:6px;font-size:11.5px;cursor:pointer;background:var(--panel);}
.monthcell.today{border-color:var(--accent);}
.monthcell.other{opacity:0.35;}
.monthcell .n{font-weight:600;font-size:12px;}
.monthcell.dragover{background:var(--accent-light);}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;margin-top:4px;}
.uploadbox{border:1.5px dashed var(--border);border-radius:9px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:12px;}
.uploadbox:hover{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>

};
const PAGES = [
  {id:'dashboard',label:'Dashboard',icon:'dash'},
  {id:'timetable',label:'Timetable',icon:'time'},
  {id:'subjects',label:'Subjects',icon:'subj'},
  {id:'assessments',label:'Assessments',icon:'assess'},
  {id:'specifications',label:'Specifications',icon:'spec'},
  {id:'settings',label:'Settings',icon:'settings'}
];
const COLORS = ['#4f46e5','#0891b2','#c026d3','#ea580c','#16a34a','#dc2626','#7c3aed','#0d9488'];
const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LABEL = {sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const addDays = (iso,n)=>{
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d); // local date fields only — avoids UTC/DST conversion bugs
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};
const daysBetween = (a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const fmtDate = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

function loadData(){
  try{ const raw = localStorage.getItem('gcse_planner_v1'); if(raw) return JSON.parse(raw); }catch(e){}
  return {onboarded:false, subjects:[], topics:[], assessments:[], availability:{sun:60,mon:60,tue:60,wed:60,thu:60,fri:60,sat:60}, sessions:[], sessionLength:30, maxPerDay:4};
}
let DATA = loadData();
if(!DATA.themeColor) DATA.themeColor = '#4f46e5';
function applyTheme(){
  document.documentElement.style.setProperty('--accent', DATA.themeColor);
  document.documentElement.style.setProperty('--accent-light', DATA.themeColor+'22');
}
function save(){
  try{ localStorage.setItem('gcse_planner_v1', JSON.stringify(DATA)); }catch(e){}
  if(fbEnabled && fbUser){
    clearTimeout(fbSaveTimer);
    fbSaveTimer = setTimeout(()=>{ fbDb.collection('users').doc(fbUser.uid).set({planner: DATA}).catch(e=>console.warn('sync failed',e)); }, 800);
  }
  render();
}

// ---------- Specification parsing (heuristic) ----------
function parseSpec(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const topics = [];
  let currentTopic = null;
  const topicRe = /^(topic\s*\d+|unit\s*\d+|\d+(\.0)?\s|section\s*\d+|chapter\s*\d+)/i;
  lines.forEach(line=>{
    const clean = line.replace(/^[-*•▪]\s*/,'');
    if(topicRe.test(line) || /^[A-Z][A-Za-z ]{2,40}$/.test(line) && line.split(' ').length<=6 && !currentTopic){
      currentTopic = clean; topics.push({name:clean, points:[]});
    } else if(currentTopic){
      topics[topics.length-1].points.push(clean);
    } else {
      currentTopic = 'General'; topics.push({name:'General', points:[clean]});
    }
  });
  if(!topics.length) return [];
  return topics.map(t=> t.points.length ? t.points.map(p=>`${t.name} — ${p}`) : [t.name]).flat();
}

// ---------- Scheduling engine (with spaced repetition) ----------
const SR_INTERVALS = [1,3,7,16,35]; // days between successive reviews, by repetition index
function priorityScore(topic, todayIso){
  let score = 5; // base
  const linked = DATA.assessments.filter(a=>a.topicIds.includes(topic.id) && a.date>=todayIso);
  if(linked.length){
    const nearest = Math.min(...linked.map(a=>daysBetween(todayIso,a.date)));
    score += Math.max(0, 60 - nearest*2); // closer = higher
  }
  if(topic.status==='not-started') score += 12;
  if(topic.status==='learning') score += 6;
  if(topic.status==='comfortable') score += 1;
  if(topic.status==='mastered') score -= 12;
  if(topic.difficult) score += 8;
  const reps = topic.repIndex||0;
  if(reps===0) return score; // not yet learned — no spacing rule applies, schedule on merit above
  if(topic.dueDate){
    const untilDue = daysBetween(todayIso, topic.dueDate);
    if(untilDue<=0) score += 30 + Math.min(-untilDue*3, 20); // due or overdue — strong boost
    else if(untilDue<=2) score += 10; // coming up soon
    else score -= 25; // not due yet — de-prioritise so we don't over-study
  }
  return score;
}
function sessionType(topic){
  const reps = topic.repIndex||0;
  if(reps===0) return 'Learn';
  if(reps===1) return 'Review';
  if(reps===2) return 'Active recall';
  if(reps===3) return 'Practice questions';
  return 'Past paper';
}
function generateSchedule(){
  const start = todayISO();
  const horizon = 14;
  const topics = DATA.topics.filter(t=>t.status!=='mastered' || t.difficult);
  const scheduledCount = {}; // topicId -> sessions scheduled this run
  const newSessions = [];
  for(let d=0; d<horizon; d++){
    const dateIso = addDays(start,d);
    const dow = DAYS[new Date(dateIso+'T00:00:00').getDay()];
    let minutesLeft = DATA.availability[dow]||0;
    if(minutesLeft<=0) continue;
    // recompute priorities each day using running state snapshot
    const scored = topics.map(t=>({t, score: priorityScore(t, dateIso) - (scheduledCount[t.id]||0)*4}))
      .sort((a,b)=>b.score-a.score);
    let sessionsToday = 0;
    let cursor = 9*60; // 9:00 start in minutes
    for(const {t} of scored){
      if(minutesLeft<=0 || sessionsToday>=DATA.maxPerDay) break;
      const dur = Math.min(DATA.sessionLength, minutesLeft);
      if(dur<15) continue;
      const linked = DATA.assessments.find(a=>a.topicIds.includes(t.id) && a.date>=dateIso);
      newSessions.push({
        id: uid(), date: dateIso, subjectId: t.subjectId, topicId: t.id,
        duration: dur, type: sessionType(t), completed:false, skipped:false,
        startMin: cursor,
        why: linked ? `Your ${DATA.subjects.find(s=>s.id===t.subjectId)?.name||''} assessment "${linked.name}" is in ${daysBetween(dateIso,linked.date)} day(s) and this topic is included.` : `This topic needs attention based on your current progress.`
      });
      cursor += dur + 10;
      minutesLeft -= dur;
      sessionsToday++;
      scheduledCount[t.id] = (scheduledCount[t.id]||0)+1;
    }
  }
  // keep past sessions (history) + completed/skipped future ones untouched if already marked
  const past = DATA.sessions.filter(s=> s.date < start);
  const keptManual = DATA.sessions.filter(s=> s.date>=start && (s.completed||s.skipped||s.manuallyMoved));
  DATA.sessions = [...past, ...keptManual, ...newSessions.filter(ns=>{
    return !keptManual.some(k=>k.topicId===ns.topicId && Math.abs(daysBetween(k.date,ns.date))<2);
  })];
}

// ---------- Render ----------
let page = 'dashboard';
let modal = null; // {type:'onboarding', step:n} etc.
let calView = 'week';
let calAnchor = todayISO(); // reference date for week/month/day view
function startOfWeek(iso){ const d=new Date(iso+'T00:00:00'); const dow=d.getDay(); return addDays(iso,-dow); }
function startOfMonth(iso){ return iso.slice(0,7)+'-01'; }
const root = document.getElementById('root');

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  applyTheme();
  if(fbEnabled && fbUser===null){ renderLogin(); return; }
  if(fbEnabled && fbUser===undefined){ root.innerHTML = `<div class="empty" style="padding:80px 20px;">Loading…</div>`; return; }
  if(!DATA.onboarded){ renderOnboarding(); return; }
  root.innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="brand">Study Planner</div>
        ${PAGES.map(p=>`<button class="navitem ${page===p.id?'active':''}" data-nav="${p.id}">${ICONS[p.icon]}${p.label}</button>`).join('')}
      </div>
      <div class="main" id="main"></div>
    </div>
    <div class="mobilenav"><div class="row">
      ${PAGES.map(p=>`<button class="${page===p.id?'active':''}" data-nav="${p.id}">${ICONS[p.icon]}<span>${p.label}</span></button>`).join('')}
    </div></div>
  `;
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav; render();});
  const main = document.getElementById('main');
  if(page==='dashboard') main.innerHTML = pageDashboard();
  if(page==='timetable') main.innerHTML = pageTimetable();
  if(page==='subjects') main.innerHTML = pageSubjects();
  if(page==='assessments') main.innerHTML = pageAssessments();
  if(page==='specifications') main.innerHTML = pageSpecifications();
  if(page==='settings') main.innerHTML = pageSettings();
  wirePage();
  if(modal) renderModal();
}

function subjColor(id){ return DATA.subjects.find(s=>s.id===id)?.color || '#999'; }
function subjName(id){ return DATA.subjects.find(s=>s.id===id)?.name || '—'; }

function sessionCard(s, showDate){
  const t = DATA.topics.find(x=>x.id===s.topicId);
  const time = `${String(Math.floor(s.startMin/60)).padStart(2,'0')}:${String(s.startMin%60).padStart(2,'0')}`;
  return `<div class="session ${s.completed?'done':''}" data-session="${s.id}">
    <div class="top">
      <div>
        <div class="subj"><span class="dot" style="background:${subjColor(s.subjectId)}"></span>${subjName(s.subjectId)}</div>

function pageDashboard(){

  const upcoming = [...DATA.assessments].filter(a=>a.date>=t0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  const bySubject = DATA.subjects.map(sub=>{
    const tops = DATA.topics.filter(t=>t.subjectId===sub.id);
    const done = tops.filter(t=>t.status==='mastered'||t.status==='comfortable').length;

  <div class="card"><h3>Today</h3>
    ${today.length? today.map(s=>sessionCard(s,false)).join('') : `<div class="empty">No sessions scheduled today. Generate a timetable from Settings or add subjects.</div>`}
  </div>

    <div class="card"><h3>Upcoming assessments</h3>

        <div class="between small"><span>${x.sub.name}</span><span class="muted">${x.pct}%</span></div>

function renderCalContent(){
  const t0 = todayISO();
  if(calView==='day'){
    const sessions = DATA.sessions.filter(s=>s.date===calAnchor && !s.skipped).sort((a,b)=>a.startMin-b.startMin);
    return `<div class="card"><h3>${fmtDate(calAnchor)} ${calAnchor===t0?'<span class="tag">Today</span>':''}</h3>
      ${sessions.length? sessions.map(s=>sessionCard(s,false)).join('') : `<div class="empty">No sessions this day.</div>`}</div>`;
  }
  if(calView==='week'){
    const start = startOfWeek(calAnchor);
    let html = '<div class="weekgrid">';
    for(let i=0;i<7;i++){
      const d = addDays(start,i);
      const sessions = DATA.sessions.filter(s=>s.date===d && !s.skipped).sort((a,b)=>a.startMin-b.startMin);
      html += `<div class="daycol ${d===t0?'today':''}" data-drop-date="${d}">
        <div class="dhead">${DAY_LABEL[DAYS[i]].slice(0,3)} ${d.slice(8,10)}</div>
        ${sessions.map(dragCard).join('') || '<div class="small muted">—</div>'}
      </div>`;
    }
    return html + '</div>';
  }
  // month
  const monthStart = startOfMonth(calAnchor);
  const gridStart = startOfWeek(monthStart);
  const monthNum = monthStart.slice(0,7);
  let html = `<div class="monthgrid">`;
  for(let i=0;i<42;i++){
    const d = addDays(gridStart,i);
    const inMonth = d.slice(0,7)===monthNum;
    const sessions = DATA.sessions.filter(s=>s.date===d && !s.skipped);
    html += `<div class="monthcell ${d===t0?'today':''} ${inMonth?'':'other'}" data-drop-date="${d}" data-daycell="${d}">
      <div class="n">${Number(d.slice(8,10))}</div>
      ${sessions.length?`<span class="badge">${sessions.length}</span>`:''}
    </div>`;
  }
  return html + '</div>';
}

function groupTopics(topics){
  const groups={}, order=[];
  topics.forEach(t=>{
    const parts = t.name.split(' — ');
    const grp = parts.length>1 ? parts[0] : t.name;
    if(!groups[grp]){ groups[grp]=[]; order.push(grp); }
    groups[grp].push(t);
  });
  return order.map(g=>({group:g, items:groups[g]}));
}

// ---------- Wiring ----------
function wirePage(){
  document.querySelectorAll('[data-session]').forEach(card=>{
    const id = card.dataset.session;
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = ()=>{
        const s = DATA.sessions.find(x=>x.id===id);
        const act = btn.dataset.act;
        if(act==='complete'){
          s.completed=true;
          const t=DATA.topics.find(x=>x.id===s.topicId);
          if(t){
            t.history=t.history||[]; t.history.push(s.date); t.lastStudied=s.date;
            t.repIndex = (t.repIndex||0)+1;
            t.dueDate = addDays(s.date, SR_INTERVALS[Math.min(t.repIndex-1, SR_INTERVALS.length-1)]);
            const rank = {'not-started':0,'learning':1,'comfortable':2,'mastered':3};
            const target = t.repIndex>=4 ? 'mastered' : t.repIndex>=2 ? 'comfortable' : 'learning';
            if(rank[target] > rank[t.status||'not-started']) t.status = target;
          }
          generateSchedule(); save();
        }
        else if(act==='uncomplete'){ s.completed=false; save(); }
        else if(act==='skip'){ s.skipped=true; generateSchedule(); save(); }
        else if(act==='why'){ const box=card.querySelector('[data-why]'); box.style.display = box.style.display==='none'?'block':'none'; }
      };
    });
  });
  document.querySelectorAll('[data-calview]').forEach(b=>b.onclick=()=>{ calView=b.dataset.calview; render(); });
  document.querySelectorAll('[data-cal-nav]').forEach(b=>b.onclick=()=>{
    const dir = b.dataset.calNav;
    if(dir==='0'){ calAnchor = todayISO(); render(); return; }
    const step = calView==='month' ? 30 : calView==='week' ? 7 : 1;
    calAnchor = addDays(calAnchor, Number(dir)*step); render();
  });
  document.querySelectorAll('[data-daycell]').forEach(c=>c.addEventListener('click', ()=>{ calAnchor=c.dataset.daycell; calView='day'; render(); }));
  document.querySelectorAll('[data-drag-session]').forEach(c=>{
    c.addEventListener('dragstart', e=>{ draggedSessionId=c.dataset.dragSession; e.dataTransfer.setData('text/plain', draggedSessionId); });
  });
  document.querySelectorAll('[data-drop-date]').forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('dragover'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); zone.classList.remove('dragover');
      const id = draggedSessionId || e.dataTransfer.getData('text/plain');
      const s = DATA.sessions.find(x=>x.id===id);
      if(s){ s.date = zone.dataset.dropDate; s.manuallyMoved = true; }
      draggedSessionId = null; save();
    });
  });
  document.querySelectorAll('[data-toggle-subject]').forEach(h=>h.onclick=()=>{ const id=h.dataset.toggleSubject; specOpen[id]=!specOpen[id]; render(); });
  document.querySelectorAll('[data-toggle-group]').forEach(h=>h.onclick=()=>{ const k=h.dataset.toggleGroup; specGroupOpen[k]=!specGroupOpen[k]; render(); });
  const addSub = document.querySelector('[data-add-subject]'); if(addSub) addSub.onclick=()=>{ modal={type:'subject'}; render(); };
  document.querySelectorAll('[data-subject-color]').forEach(inp=>inp.onchange=()=>{
    const s = DATA.subjects.find(x=>x.id===inp.dataset.subjectColor); if(s){ s.color = inp.value; save(); }
  });
  document.querySelectorAll('[data-remove-subject]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.removeSubject; DATA.subjects=DATA.subjects.filter(s=>s.id!==id); DATA.topics=DATA.topics.filter(t=>t.subjectId!==id);
    DATA.assessments=DATA.assessments.filter(a=>a.subjectId!==id); generateSchedule(); save();
  });
  const addAss = document.querySelector('[data-add-assessment]'); if(addAss) addAss.onclick=()=>{ modal={type:'assessment'}; render(); };
  document.querySelectorAll('[data-remove-assessment]').forEach(b=>b.onclick=()=>{
    DATA.assessments=DATA.assessments.filter(a=>a.id!==b.dataset.removeAssessment); generateSchedule(); save();
  });
  document.querySelectorAll('[data-paste-spec]').forEach(b=>b.onclick=()=>{ modal={type:'spec', subjectId:b.dataset.pasteSpec}; render(); });
  document.querySelectorAll('[data-topic-status]').forEach(sel=>sel.onchange=()=>{
    const t=DATA.topics.find(x=>x.id===sel.dataset.topicStatus); t.status=sel.value; generateSchedule(); save();
  });
  document.querySelectorAll('[data-avail]').forEach(inp=>inp.onchange=()=>{ DATA.availability[inp.dataset.avail]=Number(inp.value)||0; save(); });
  const sl=document.querySelector('[data-session-length]'); if(sl) sl.onchange=()=>{ DATA.sessionLength=Number(sl.value)||30; save(); };
  const mpd=document.querySelector('[data-max-per-day]'); if(mpd) mpd.onchange=()=>{ DATA.maxPerDay=Number(mpd.value)||4; save(); };
  const themeColor=document.getElementById('theme-color'); if(themeColor) themeColor.oninput=()=>{ DATA.themeColor=themeColor.value; applyTheme(); };
  if(themeColor) themeColor.onchange=()=> save();
  const gen=document.querySelector('[data-generate]'); if(gen) gen.onclick=()=>{ generateSchedule(); save(); page='timetable'; render(); };
  const demo=document.querySelector('[data-load-demo]'); if(demo) demo.onclick=loadDemoData;
  const resetAll=document.querySelector('[data-reset-all]'); if(resetAll) resetAll.onclick=()=>{ if(confirm('Reset all data?')){ DATA={onboarded:false, subjects:[], topics:[], assessments:[], availability:{sun:60,mon:60,tue:60,wed:60,thu:60,fri:60,sat:60}, sessions:[], sessionLength:30, maxPerDay:4}; save(); } };
  const signOut=document.querySelector('[data-fb-signout]'); if(signOut) signOut.onclick=()=> firebase.auth().signOut();
  const changeEmail=document.querySelector('[data-fb-change-email]'); if(changeEmail) changeEmail.onclick=()=>{
    const newEmail = document.getElementById('fb-new-email').value.trim();
    const errEl = document.getElementById('fb-email-err'); errEl.textContent='';
    if(!newEmail) return;
    firebase.auth().currentUser.verifyBeforeUpdateEmail(newEmail).then(()=>{
      errEl.style.color='var(--good)';
      errEl.textContent = `Check ${newEmail} for a verification link — your login email updates once you click it.`;
    }).catch(e=>{
      errEl.style.color='#dc2626';
      errEl.textContent = e.code==='auth/requires-recent-login'
        ? 'For security, Firebase needs you to sign out and sign back in before changing your email — then try again.'
        : e.message;
    });
  };
}

    <div class="uploadbox" id="m-uploadbox">📄 Click to upload a spec PDF, or drop it here<input type="file" id="m-pdf" accept="application/pdf" style="display:none;"></div>
    <div class="small muted" id="m-pdf-status" style="margin-bottom:8px;"></div>
    <div class="field"><textarea id="m-spec" style="min-height:220px;" placeholder="Topic 1: Cell Biology\nCell structure\nMicroscopy\n\nTopic 2: Organisation\nTissues\nOrgans">${existing}</textarea></div>
    <div class="row" style="margin-top:16px;"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-save-spec>Parse & save</button></div>`;
  } else if(modal.type==='onboarding'){
    renderOnboardingModal(); return;
  }
  const overlay = el(`<div class="modal-overlay"><div class="modal" style="position:relative;">${body}</div></div>`);
  root.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay){ modal=null; render(); } });
  overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ modal=null; render(); });

  if(modal.type==='subject'){
    overlay.querySelector('[data-save-subject]').onclick=()=>{
      const name=document.getElementById('m-name').value.trim(); if(!name) return;
      DATA.subjects.push({id:uid(), name, board:document.getElementById('m-board').value||'—', qual:document.getElementById('m-qual').value||'GCSE', color: COLORS[DATA.subjects.length%COLORS.length]});
      modal=null; save();
    };
  }
  if(modal.type==='assessment'){
    const subSel = document.getElementById('m-subject');
    let assGroupOpen = {};
    let selectedTopicIds = new Set();
    const renderTopics = ()=>{
      const tops = DATA.topics.filter(t=>t.subjectId===subSel.value);
      const html = tops.length ? groupTopics(tops).map(g=>{
        const gopen = assGroupOpen[g.group]!==false; // default open in this small picker
        const selCount = g.items.filter(t=>selectedTopicIds.has(t.id)).length;
        return `<div>
          <div class="group-head ${gopen?'open':''}" data-ass-group="${g.group}">
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
            ${g.group} <span class="muted small">${selCount?`(${selCount} selected)`:`(${g.items.length})`}</span>
          </div>
          ${gopen ? g.items.map(t=>`<label class="checklabel"><input type="checkbox" value="${t.id}" ${selectedTopicIds.has(t.id)?'checked':''}><span>${t.name.includes(' — ')?t.name.split(' — ').slice(1).join(' — '):t.name}</span></label>`).join('') : ''}
        </div>`;
      }).join('') : `<div class="small muted">No spec points yet for this subject.</div>`;
      document.getElementById('m-topics').innerHTML = html;
      document.querySelectorAll('[data-ass-group]').forEach(h=>h.onclick=()=>{ const g=h.dataset.assGroup; assGroupOpen[g]=!(assGroupOpen[g]!==false); renderTopics(); });
    };
    document.getElementById('m-topics').addEventListener('change', e=>{
      if(e.target.type==='checkbox'){ if(e.target.checked) selectedTopicIds.add(e.target.value); else selectedTopicIds.delete(e.target.value); renderTopics(); }
    });
    subSel.onchange = ()=>{ selectedTopicIds = new Set(); renderTopics(); };
    renderTopics();
    overlay.querySelector('[data-save-assessment]').onclick=()=>{
      const name=document.getElementById('m-name').value.trim(); if(!name) return;
      const topicIds = Array.from(selectedTopicIds);
      DATA.assessments.push({id:uid(), name, subjectId:subSel.value, date:document.getElementById('m-date').value, type:document.getElementById('m-type').value, topicIds});
      modal=null; generateSchedule(); save();
    };
  }
  if(modal.type==='spec'){
    const box = document.getElementById('m-uploadbox');
    const fileInput = document.getElementById('m-pdf');
    const status = document.getElementById('m-pdf-status');
    box.onclick = ()=> fileInput.click();
    box.ondragover = e=>{ e.preventDefault(); box.style.borderColor='var(--accent)'; };
    box.ondragleave = ()=>{ box.style.borderColor=''; };
    box.ondrop = e=>{ e.preventDefault(); box.style.borderColor=''; if(e.dataTransfer.files[0]) handlePdf(e.dataTransfer.files[0]); };
    fileInput.onchange = ()=>{ if(fileInput.files[0]) handlePdf(fileInput.files[0]); };
    async function handlePdf(file){
      status.textContent = 'Reading PDF…';
      try{
        if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const buf = await file.arrayBuffer();
        const doc = await pdfjsLib.getDocument({data: buf}).promise;
        let text = '';
        for(let p=1; p<=doc.numPages; p++){
          const page = await doc.getPage(p);
          const content = await page.getTextContent();
          let lastY=null, line='';
          content.items.forEach(it=>{
            if(lastY!==null && Math.abs(it.transform[5]-lastY)>4){ text += line+'\n'; line=''; }
            line += it.str+' '; lastY = it.transform[5];
          });
          text += line + '\n';
        }
        document.getElementById('m-spec').value = text.trim();
        status.textContent = `Extracted text from ${doc.numPages} page(s) — review below, then Parse & save.`;
      }catch(err){ status.textContent = 'Could not read that PDF — try pasting the text instead.'; }
    }
    overlay.querySelector('[data-save-spec]').onclick=()=>{
      const text=document.getElementById('m-spec').value;
      const names = parseSpec(text);
      DATA.topics = DATA.topics.filter(t=>t.subjectId!==modal.subjectId);
      names.forEach(n=> DATA.topics.push({id:uid(), subjectId:modal.subjectId, name:n, status:'not-started', difficult:false, history:[], lastStudied:null, repIndex:0, dueDate:null}));
      modal=null; generateSchedule(); save();
    };
  }
}

// ---------- Onboarding ----------
let onb = {step:1, subjects:[], avail:60};
function renderOnboarding(){
  root.innerHTML = `<div class="modal-overlay"><div class="modal">
    <div class="step-dots">${[1,2,3].map(i=>`<span class="${onb.step>=i?'on':''}"></span>`).join('')}</div>
    ${onb.step===1?`
      <h2>What subjects are you studying?</h2><p class="small muted">Add each subject with its exam board.</p>
      <div class="subjectlist" id="onb-list">${onb.subjects.map((s,i)=>`<span class="chip"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${s.name} (${s.board})<button data-remove-onb="${i}">×</button></span>`).join('')}</div>
      <div class="field"><label>Subject name</label><input id="onb-name" placeholder="e.g. Mathematics"></div>
      <div class="field"><label>Exam board & qualification</label><input id="onb-board" placeholder="e.g. Edexcel IGCSE"></div>
      <button class="btn" id="onb-add">+ Add subject</button>
      <div style="margin-top:20px;"><button class="btn btn-primary" id="onb-next" ${!onb.subjects.length?'disabled':''}>Continue</button></div>
    `:''}
    ${onb.step===2?`
      <h2>How much do you want to study?</h2><p class="small muted">Minutes per day. You can fine-tune this later in Settings.</p>
      <div class="field"><label>Minutes/day (same every day)</label><input id="onb-avail" type="number" value="${onb.avail}"></div>
      <div class="row" style="margin-top:20px;"><button class="btn btn-ghost" id="onb-back">Back</button><button class="btn btn-primary" id="onb-next2">Continue</button></div>
    `:''}
    ${onb.step===3?`
      <h2>You're all set</h2><p class="small muted">Add your specifications and assessments once inside — or load demo data to explore first.</p>
      <div class="row" style="margin-top:20px;"><button class="btn" id="onb-demo">Load demo data</button><button class="btn btn-primary" id="onb-finish">Start blank</button></div>
    `:''}
  </div></div>`;
  if(onb.step===1){
    document.getElementById('onb-add').onclick=()=>{
      const name=document.getElementById('onb-name').value.trim(); const board=document.getElementById('onb-board').value.trim();
      if(!name) return; onb.subjects.push({name, board: board||'GCSE'}); renderOnboarding();
    };
    document.querySelectorAll('[data-remove-onb]').forEach(b=>b.onclick=()=>{ onb.subjects.splice(Number(b.dataset.removeOnb),1); renderOnboarding(); });
    const nx=document.getElementById('onb-next'); if(nx) nx.onclick=()=>{ onb.step=2; renderOnboarding(); };
  }
  if(onb.step===2){
    document.getElementById('onb-back').onclick=()=>{ onb.step=1; renderOnboarding(); };
    document.getElementById('onb-next2').onclick=()=>{ onb.avail=Number(document.getElementById('onb-avail').value)||60; onb.step=3; renderOnboarding(); };
  }
  if(onb.step===3){
    document.getElementById('onb-finish').onclick=()=>finishOnboarding(false);
    document.getElementById('onb-demo').onclick=()=>finishOnboarding(true);
  }
}
function finishOnboarding(demo){
  onb.subjects.forEach((s,i)=> DATA.subjects.push({id:uid(), name:s.name, board:s.board, qual:'GCSE', color:COLORS[i%COLORS.length]}));
  DAYS.forEach(d=> DATA.availability[d]=onb.avail);
  DATA.onboarded = true;
  save();
  if(demo) loadDemoData(); else { generateSchedule(); save(); }
}

function loadDemoData(){
  DATA.subjects = [
    {id:uid(),name:'Mathematics',board:'Edexcel',qual:'IGCSE',color:COLORS[0]},
    {id:uid(),name:'Biology',board:'Pearson Edexcel',qual:'IGCSE',color:COLORS[1]},
    {id:uid(),name:'German',board:'AQA',qual:'GCSE',color:COLORS[2]},
    {id:uid(),name:'Computer Science',board:'OCR',qual:'GCSE',color:COLORS[3]},
  ];
  const [maths,bio,ger,cs] = DATA.subjects;
  DATA.topics = [];
  const specs = {
    [maths.id]: ['Algebra — Factorising quadratics','Algebra — Solving equations','Number — Fractions & percentages','Geometry — Circle theorems','Statistics — Averages'],
    [bio.id]: ['Cell Biology — Cell structure','Cell Biology — Microscopy','Enzymes — Factors affecting activity','Enzymes — Required practical','Organisation — Digestive system'],
    [ger.id]: ['Speaking — Vocabulary','Speaking — Grammar structures','Writing — Tenses','Listening — Comprehension'],
    [cs.id]: ['Programming — Sequencing & selection','Programming — Iteration','Networks — Topologies','Data — Binary & hex'],
  };
  Object.entries(specs).forEach(([subjectId, names])=>{
    names.forEach((n,i)=> DATA.topics.push({id:uid(), subjectId, name:n, status: i===0?'learning':'not-started', difficult:i===1, history:[], lastStudied:null, repIndex:0, dueDate:null}));
  });
  const t0 = todayISO();
  const bioTopics = DATA.topics.filter(t=>t.subjectId===bio.id && t.name.startsWith('Enzymes'));
  const mathsTopics = DATA.topics.filter(t=>t.subjectId===maths.id);
  DATA.assessments = [
    {id:uid(), name:'End of Topic Test', subjectId:bio.id, date:addDays(t0,12), type:'End-of-topic test', topicIds: bioTopics.map(t=>t.id)},
    {id:uid(), name:'Maths Mock', subjectId:maths.id, date:addDays(t0,31), type:'Mock exam', topicIds: mathsTopics.map(t=>t.id)},
    {id:uid(), name:'Speaking Assessment', subjectId:ger.id, date:addDays(t0,45), type:'School assessment', topicIds: DATA.topics.filter(t=>t.subjectId===ger.id).map(t=>t.id)},
  ];
  DAYS.forEach((d,i)=> DATA.availability[d] = [90,90,45,120,60,30,120][i]);
  DATA.onboarded = true;
  generateSchedule();
  save();
  page='dashboard'; render();
}

function renderLogin(){
  root.innerHTML = `<div class="modal-overlay"><div class="modal">
    <h2>Sign in to sync</h2><p class="small muted">Use the same account on every device to keep your planner in sync.</p>
    <button class="btn" id="fb-google" style="width:100%;justify-content:center;margin-bottom:14px;">Sign in with Google</button>
    <div class="small muted" style="text-align:center;margin-bottom:14px;">— or —</div>
    <div class="field"><label>Email</label><input id="fb-email" type="email" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="fb-pass" type="password" autocomplete="current-password"></div>
    <div id="fb-err" class="small" style="color:#dc2626;margin-bottom:8px;"></div>
    <div class="row"><button class="btn btn-primary" id="fb-signin">Sign in</button><button class="btn" id="fb-signup">Create account</button></div>
  </div></div>`;
  const errEl = ()=>document.getElementById('fb-err');
  const doAuth = mode=>{
    const email=document.getElementById('fb-email').value.trim();
    const pass=document.getElementById('fb-pass').value;
    errEl().textContent='';
    const fn = mode==='in' ? firebase.auth().signInWithEmailAndPassword(email,pass) : firebase.auth().createUserWithEmailAndPassword(email,pass);
    fn.catch(e=> errEl().textContent = e.message);
  };
  document.getElementById('fb-signin').onclick=()=>doAuth('in');
  document.getElementById('fb-signup').onclick=()=>doAuth('up');
  document.getElementById('fb-google').onclick=()=>{
    errEl().textContent='';
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=> errEl().textContent = e.message);
  };
}
if(fbEnabled){
  firebase.auth().onAuthStateChanged(user=>{
    fbUser = user || null;
    if(fbUnsub){ fbUnsub(); fbUnsub=null; }
    if(user){
      fbUnsub = fbDb.collection('users').doc(user.uid).onSnapshot(doc=>{
        if(doc.exists && doc.data().planner) DATA = doc.data().planner;
        else fbDb.collection('users').doc(user.uid).set({planner: DATA}); // first sync: push local data up
        render();
      });
    } else { render(); }
  });
} else {
  render();
}
</script>
